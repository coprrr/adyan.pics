<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>places</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main class="page wide">
    <p class="back"><a href="../photos.html">← photos</a></p>
    <h1>places/</h1>

    <section class="country-section">
      <h2 class="country-heading">canada/</h2>

      <section class="place-section" id="tobermory">
        <h3>tobermory/ <span class="muted">2024</span></h3>
        <div class="photo-grid" data-gallery-secondary="places.canada.tobermory" data-path-prefix="../"></div>
      </section>

      <section class="place-section" id="grand-bend">
        <h3>grand bend/ <span class="muted">2026</span></h3>
        <div class="photo-grid" data-gallery-secondary="places.canada.grandBend" data-path-prefix="../"></div>
      </section>
    </section>

    <section class="country-section">
      <h2 class="country-heading">india/</h2>

      <section class="place-section" id="agra">
        <h3>agra/ <span class="muted">2022</span></h3>
        <div class="photo-grid" data-gallery-secondary="places.india.agra" data-path-prefix="../"></div>
      </section>
    </section>

    <footer><a href="../photos.html">← photos</a></footer>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close">×</button>
    <button class="lightbox-prev" aria-label="Previous photo">←</button>
    <figure class="lightbox-figure">
      <img id="lightbox-image" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <button class="lightbox-next" aria-label="Next photo">→</button>
  </div>

  <script src="../photos-data.js"></script>
  <script src="../gallery.js"></script>
</body>
</html>
