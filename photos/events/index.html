<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="page wide">
    <p class="back"><a href="/photos">← photos</a></p>
    <h1>events/</h1>

    <section class="place-section" id="vct">
      <h2>vct/</h2>
      <p class="place-meta">2025</p>
      <div class="photo-grid" data-gallery-secondary="events.vct"></div>
    </section>

    <footer><a href="/photos">← photos</a></footer>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close">×</button>
    <button class="lightbox-prev" aria-label="Previous photo">←</button>
    <figure class="lightbox-figure">
      <img id="lightbox-image" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <button class="lightbox-next" aria-label="Next photo">→</button>
  </div>

  <script src="/photos-data.js"></script>
  <script src="/gallery.js"></script>
</body>
</html>
