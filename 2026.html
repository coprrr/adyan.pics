<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canadian International AutoShow — 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <main class="page wide">
    <p class="back"><a href="../../photos.html">← photos</a></p>

    <h1>photos/autoshow/2026/</h1>
    <p class="muted">Canadian International AutoShow — 2026</p>

    <div class="photo-grid" data-gallery="autoshow2026"></div>

    <footer>
      <a href="../../photos.html">← photos</a>
    </footer>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close">×</button>
    <button class="lightbox-prev" aria-label="Previous photo">←</button>
    <figure class="lightbox-figure">
      <img id="lightbox-image" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <button class="lightbox-next" aria-label="Next photo">→</button>
  </div>

  <script src="../../photos-data.js"></script>
  <script>
    // Prefix root-relative image paths for this nested page.
    for (const group of Object.values(window.PHOTO_DATA)) {
      for (const photo of group) {
        if (!photo.src.startsWith("../../")) photo.src = "../../" + photo.src;
      }
    }
  </script>
  <script src="../../gallery.js"></script>
</body>
</html>
